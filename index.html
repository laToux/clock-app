<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Digital Clock</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <div class="clock-container">
    <svg class="seconds-circle" width="100%" height="100%" viewBox="0 0 100 100">
      <circle class="background-circle" cx="50" cy="50" r="48" transform="rotate(-90 50 50)" />
      <circle class="progress-circle" cx="50" cy="50" r="48" transform="rotate(-90 50 50)" />
    </svg>
    <div class="clock-content">
      <div class="day"></div>
      <div class="time-wrapper">
        <div class="time"></div>
        <div class="ampm"></div>
      </div>
      <div class="date"></div>
    </div>
  </div>
  <script src="script.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js')
        .then(() => console.log('Service Worker registered'))
        .catch(error => console.error('Service Worker registration failed:', error));
    }
  </script>
</body>
</html>
